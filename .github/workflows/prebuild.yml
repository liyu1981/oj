name: prebuild

# Downloadable Linux CLI binaries, so each upstream release on the fork
# carries amd64 (x86_64) and arm64 (aarch64) glibc builds of `oj` without
# the caller needing a Rust toolchain. Each target builds natively on a
# matching runner rather than cross-compiling, which keeps rusty_v8's
# prebuilt-archive selection and the native linked-v8 path exactly what
# `cargo install oj` produces.
#
# A tag is the release trigger: tools/prebuild-release.sh pushes vX.Y.Z and
# this runs the builds, then attaches the tarballs to a GitHub release of
# the same name. The script's `prebuild` branch push only moves the ref, so
# a sync does not start a second build. workflow_dispatch builds the
# artifacts without touching a release.
#
# musl (*-linux-musl) is deliberately not built: upstream oj_deno_runtime
# calls libc::malloc_trim, which the `libc` crate exposes only for glibc, so
# the workspace does not compile for musl. When that is cfg-guarded (here or
# upstream), re-add the musl matrix entries plus the musl-gcc kernel UAPI
# headers libffi-sys needs (linux-libc-dev and
# CFLAGS=-idirafter /usr/include -idirafter /usr/include/$(gcc -print-multiarch)).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Best effort: one arch failing must not stop the other or skip the
    # release. The release job reports any tarball that did not arrive.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-gnu
          # Match upstream's arm release runner: 24.04-arm runners were
          # shutting the job down mid-link on 0.3.x, before the fat-LTO oj
          # binary finished.
          - runner: ubuntu-22.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The fat-LTO link outgrows a 16GB runner and the kernel kills rustc;
      # swap lets it finish (the same workaround upstream's release uses).
      - name: add swap
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 24G /swap-oj
          sudo chmod 600 /swap-oj
          sudo mkswap /swap-oj
          sudo swapon /swap-oj
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Release, not debug: this is the artifact people download, and it is
      # the same profile `cargo install oj --locked` builds.
      - name: cargo build
        run: cargo build --release --locked -p oj --target ${{ matrix.target }}
      - name: smoke
        run: ./target/${{ matrix.target }}/release/oj --version
      - name: package
        run: |
          out="oj-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/oj" "$out/oj"
          tar -C "$out" -czf "$out.tar.gz" oj
          sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oj-linux-${{ matrix.arch }}
          path: |
            oj-*.tar.gz
            oj-*.tar.gz.sha256
          if-no-files-found: error

  # One release for the tag, with both builds attached. The tag already exists
  # (the script pushed it); this only fills in the release. Re-runs clobber the
  # assets instead of failing on an existing release.
  release:
    name: github release
    needs: build
    # A failed arch still gets a release for the other one, with a warning in
    # the notes. `always()` also covers a cancelled/partially failed matrix.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true
      - name: create the release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          missing=()
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            file="oj-${GITHUB_REF_NAME}-${target}.tar.gz"
            [ -f "dist/$file" ] || missing+=("$file")
          done
          ver="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Same CHANGELOG-section extraction upstream's release.yml uses,
            # so the fork release notes match the upstream release.
            awk -v ver="$ver" '$0 ~ "^## \\[" ver "\\]" {f=1; next} /^## \[/ {f=0} f' \
              CHANGELOG.md > notes.md
            if [ -s notes.md ]; then
              gh release create "$GITHUB_REF_NAME" \
                --title "oj $GITHUB_REF_NAME" --notes-file notes.md --latest=false
            else
              gh release create "$GITHUB_REF_NAME" \
                --title "oj $GITHUB_REF_NAME" --generate-notes --latest=false
            fi
          fi
          upload_ok=1
          if compgen -G "dist/*" >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber || upload_ok=0
          else
            upload_ok=0
            echo "::warning::no prebuilt artifacts were produced"
          fi
          [ "$upload_ok" -eq 1 ] || missing+=("artifact upload failed")
          # Keep the release usable when one arch failed, and make a rerun
          # that fixed it remove the old warning.
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          warning=""
          if [ ${#missing[@]} -gt 0 ]; then
            list=$(printf '%s, ' "${missing[@]}")
            list=${list%, }
            warning="> **Release warning:** missing prebuilt targets: ${list}. See [the run]($RUN_URL)."
          fi
          BODY="$body" WARNING="$warning" python3 - <<'PY' > notes.md
          import os
          body = os.environ["BODY"]
          warning = os.environ.get("WARNING", "")
          lines = [line for line in body.splitlines() if not line.startswith("> **Release warning:**")]
          while lines and not lines[0].strip():
              lines.pop(0)
          if warning:
              lines = [warning, ""] + lines
          print("\n".join(lines).rstrip() + "\n")
          PY
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          # The daily sync can release several tags in one run and their
          # workflows race. GitHub would otherwise mark whichever was
          # *published* last as "Latest" (v0.2.38 beat v0.2.39 that way), so
          # never let create claim it and let only the highest semver release
          # take it. Re-running this job also repairs a wrong label.
          latest="$(gh release list --limit 200 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' | sed '/^$/d' | sort -V | tail -1)"
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            gh release edit "$GITHUB_REF_NAME" --latest
          fi
          ls -l dist
